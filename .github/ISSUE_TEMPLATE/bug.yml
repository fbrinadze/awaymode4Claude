name: Bug report
description: Something in Away Mode does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, secrets, tenant IDs, or logs that contain them.
        Report security vulnerabilities privately, as described in SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: input
    id: bun
    attributes:
      label: Bun version
      description: Output of `bun --version`
    validations:
      required: true
